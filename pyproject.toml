[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adult-income-classifier"
version = "1.0.0"
description = "Precision-first income classification on the UCI Adult Census dataset."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Ahmad Abbas" }]
keywords = ["machine-learning", "scikit-learn", "classification", "census"]
dependencies = [
    "scikit-learn>=1.4,<1.7",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "matplotlib>=3.8", "seaborn>=0.13"]

[project.scripts]
income-classifier = "income_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
